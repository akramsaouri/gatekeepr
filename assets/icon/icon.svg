<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The Gatekeepr app icon at 128 px and up: a frosted-glass G on a near-black
    body. The 16 and 32 px sizes come from icon-small.svg instead.
    scripts/make-icon renders both into assets/icon/AppIcon.icns.

    It follows the macOS icon grid: an 824 x 824 body centred on the 1024
    canvas, with continuous-curvature corners (radius 185.4) and a soft drop
    shadow in the 100-unit margin.
  -->
  <defs>
    <path id="body" d="M383.41 100L640.59 100C722.19 100 763 100 799.79 112.14C844 123.84 900.16 180 911.86 224.21C924 261 924 301.81 924 383.41L924 640.59C924 722.19 924 763 911.86 799.79C900.16 844 844 900.16 799.79 911.86C763 924 722.19 924 640.59 924L383.41 924C301.81 924 261 924 224.21 911.86C180 900.16 123.84 844 112.14 799.79C100 763 100 722.19 100 640.59L100 383.41C100 301.81 100 261 112.14 224.21C123.84 180 180 123.84 224.21 112.14C261 100 301.81 100 383.41 100Z"/>
    <!--
      The G: a ring centred on (516, 512), outer radius 276 and 120 thick, cut
      radially at 42 degrees for the upper terminal. The square spur is a bar
      from the centre out to x = 781, between y = 472 and 592, and a stem down
      its right-hand side that ends where it meets the ring.
    -->
    <path id="g" d="M721.11 327.32A276 276 0 1 0 649.93 753.33L781 753.33L781 472L516 472L516 592L649.93 592A156 156 0 1 1 631.93 407.62Z"/>

    <clipPath id="body-clip"><use href="#body"/></clipPath>
    <clipPath id="g-clip"><use href="#g"/></clipPath>

    <filter id="body-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="g-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="g-halo" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <!-- Light caught inside the glass: bright at the edges, fading inwards. -->
    <filter id="g-inner-glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="wide-blur"/>
      <feComposite in="SourceAlpha" in2="wide-blur" operator="out" result="wide"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="tight-blur"/>
      <feComposite in="SourceAlpha" in2="tight-blur" operator="out" result="tight"/>
      <feComposite in="wide" in2="tight" operator="arithmetic" k2="0.8" k3="1.3" result="rim"/>
      <feFlood flood-color="#e9effa"/>
      <feComposite in2="rim" operator="in"/>
    </filter>

    <linearGradient id="body-fill" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#1b1e26"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <radialGradient id="body-top-light" gradientUnits="userSpaceOnUse" cx="512" cy="100" r="440" gradientTransform="translate(0 45) scale(1 0.55)">
      <stop offset="0" stop-color="#d6deeb" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#d6deeb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body-vignette" gradientUnits="userSpaceOnUse" cx="512" cy="440" r="580">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="body-rim" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="g-fill" gradientUnits="userSpaceOnUse" x1="300" y1="236" x2="760" y2="788">
      <stop offset="0" stop-color="#aab8d0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6b7890" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="g-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="236" x2="0" y2="560">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-edge" gradientUnits="userSpaceOnUse" x1="260" y1="236" x2="780" y2="788">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <use href="#body" fill="#000" opacity="0.3" filter="url(#body-shadow)" transform="translate(0 10)"/>

  <g clip-path="url(#body-clip)">
    <use href="#body" fill="url(#body-fill)"/>
    <use href="#body" fill="url(#body-top-light)"/>
    <use href="#body" fill="url(#body-vignette)"/>

    <!-- The G's shadow on the body, and the light it spills around itself. -->
    <use href="#g" fill="#000" opacity="0.55" filter="url(#g-shadow)" transform="translate(6 16)"/>
    <use href="#g" fill="#d3dcee" opacity="0.3" filter="url(#g-halo)"/>

    <!-- The glass. -->
    <use href="#g" fill="url(#g-fill)"/>
    <g clip-path="url(#g-clip)">
      <use href="#g" fill="url(#g-sheen)"/>
      <use href="#g" filter="url(#g-inner-glow)"/>
      <use href="#g" fill="none" stroke="url(#g-edge)" stroke-width="5"/>
    </g>

    <use href="#body" fill="none" stroke="url(#body-rim)" stroke-width="4"/>
  </g>
</svg>
