<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The Gatekeepr app icon at 16 and 32 px (@1x and @2x): a flat silver G on a
    near-black body, with none of icon.svg's glass, so it stays legible in
    Finder lists, notification banners and Login Items.

    Same grid and body as icon.svg. The G is drawn for a 16-pixel grid
    (64 units a pixel): its left, top and bottom edges, the bar and the stem's
    right edge all fall on whole pixels at 16 and 32 px. Its upper terminal is
    cut steeper than icon.svg's, so the mouth stays open at 16 px.
  -->
  <defs>
    <path id="body" d="M383.41 100L640.59 100C722.19 100 763 100 799.79 112.14C844 123.84 900.16 180 911.86 224.21C924 261 924 301.81 924 383.41L924 640.59C924 722.19 924 763 911.86 799.79C900.16 844 844 900.16 799.79 911.86C763 924 722.19 924 640.59 924L383.41 924C301.81 924 261 924 224.21 911.86C180 900.16 123.84 844 112.14 799.79C100 763 100 722.19 100 640.59L100 383.41C100 301.81 100 261 112.14 224.21C123.84 180 180 123.84 224.21 112.14C261 100 301.81 100 383.41 100Z"/>
    <clipPath id="body-clip"><use href="#body"/></clipPath>
    <filter id="body-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <use href="#body" fill="#000" opacity="0.3" filter="url(#body-shadow)" transform="translate(0 10)"/>
  <use href="#body" fill="#15171c"/>
  <!-- A faint rim, so the body doesn't vanish on a dark background. -->
  <g clip-path="url(#body-clip)">
    <use href="#body" fill="none" stroke="#464b56" stroke-width="32"/>
  </g>

  <!--
    The G: a ring centred on (512, 512), outer radius 256 and 128 thick, cut
    radially at 56 degrees for the upper terminal. The bar runs from the centre
    out to x = 768, between y = 448 and 576, with a stem down its right-hand side.
  -->
  <path d="M655.15 299.77A256 256 0 1 0 622.85 742.76L768 742.76L768 448L512 448L512 576L622.85 576A128 128 0 1 1 583.58 405.88Z" fill="#cfd4dd"/>
</svg>
