name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Builds every target: GatekeeprCore, the CLI, and the menu bar app.
      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check fixtures are sanitized
        run: scripts/sanitize-log --check Tests/GatekeeprCoreTests/Fixtures

      - name: Build Gatekeepr.app
        run: scripts/build-app

      - name: Check Gatekeepr.app
        run: |
          app=build/Gatekeepr.app
          plist="$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/Gatekeepr"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = io.github.akramsaouri.gatekeepr
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = true
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
