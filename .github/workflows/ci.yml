name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Builds every target: GatekeeprCore, the CLI, and the menu bar app.
      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check fixtures are sanitized
        run: scripts/sanitize-log --check Tests/GatekeeprCoreTests/Fixtures

      # What a release ships: the universal CLI and Gatekeepr.app, packaged into
      # dist/ exactly as the release workflow does it on a tag.
      - name: Build release files
        run: scripts/build-release

      # Checksums, lipo -archs on both binaries, the ad-hoc signatures, the
      # app's Info.plist, and that every version agrees.
      - name: Check release files
        run: scripts/check-release
