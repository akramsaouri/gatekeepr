name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go from ${{ matrix.go-version-file }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod's go line is the oldest Go gatekeepr builds with (what the
        # README promises); .go-version is the Go releases are built with.
        go-version-file: [go.mod, .go-version]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          # No dependencies, so nothing to cache.
          cache: false

      - name: Go version
        run: go version

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Includes the golden files: every state, history, errors, help and
      # usage errors, byte for byte.
      - name: Test
        run: go test -race ./...

      - name: Check fixtures are sanitized
        run: scripts/sanitize-log --check testdata/fixtures

  release-files:
    name: Release files
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      # What a release ships: the universal CLI, packaged into dist/ exactly as
      # the release workflow does it on a tag.
      - name: Build release files
        run: scripts/build-release

      # Checksums, the archive's contents, lipo -archs, the ad-hoc signature
      # with the hardened runtime, and the version on both slices.
      - name: Check release files
        run: scripts/check-release
